# Bonus: sidecar pattern - two containers sharing a volume
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-pod
spec:
  volumes:
    - name: shared
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/index.html; sleep 5; done"]
      volumeMounts: [{ name: shared, mountPath: /data }]
    - name: web
      image: nginx:1.27-alpine
      ports: [{ containerPort: 80 }]
      volumeMounts: [{ name: shared, mountPath: /usr/share/nginx/html }]
