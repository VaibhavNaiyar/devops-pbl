groups:
  - name: shop-app
    rules:
      - alert: AppDown
        expr: up{job="shop-app"} == 0
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "Shop app is down" }
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of requests failing" }
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "p95 latency above 500ms" }
      - alert: HighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Host CPU above 80%" }
