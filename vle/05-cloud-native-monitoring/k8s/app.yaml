# Same app on Kubernetes with probes, resource limits and autoscaling
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  labels: { app: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: shop } }
  template:
    metadata:
      labels: { app: shop }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: shop
          image: pbl-shop:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env: [{ name: APP_VERSION, value: "1.0.0" }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 300m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /ready, port: 3000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: shop }
spec:
  selector: { app: shop }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: shop }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: shop }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
