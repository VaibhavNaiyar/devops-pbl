services:
  jenkins:
    build: .
    image: pbl-jenkins:1.0
    container_name: jenkins
    user: root            # lab only: lets Jenkins use the host docker socket
    ports: ["8080:8080", "50000:50000"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [kind]

  sonarqube:              # used by VLE 9
    image: sonarqube:10-community
    container_name: sonarqube
    ports: ["9000:9000"]
    networks: [kind]
    profiles: ["devsecops"]

volumes:
  jenkins_home:
networks:
  kind:
    external: true        # created by `kind create cluster`
