services:
  jenkins:
    build: .
    image: pbl-jenkins:1.0
    container_name: jenkins
    user: root            # lab only: lets Jenkins use the host docker socket
    ports: ["8080:8080"]   # agent port 50000 not published: unused (builds run on controller) and reserved on Windows
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [kind]

  sonarqube:              # used by VLE 9
    image: sonarqube:10-community
    container_name: sonarqube
    ports: ["9000:9000"]
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true   # Docker Desktop VM has vm.max_map_count=65530 (lab only)
    networks: [kind]
    profiles: ["devsecops"]

volumes:
  jenkins_home:
networks:
  kind:
    external: true        # created by `kind create cluster`
