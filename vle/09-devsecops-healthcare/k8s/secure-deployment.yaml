apiVersion: v1
kind: Namespace
metadata:
  name: healthcare
  labels:
    pod-security.kubernetes.io/enforce: restricted   # Pod Security Admission
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: patient-api, namespace: healthcare }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-api
  namespace: healthcare
  labels: { app: patient-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: patient-api } }
  template:
    metadata: { labels: { app: patient-api } }
    spec:
      serviceAccountName: patient-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 8080 }]
          env:
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: patient-api-secret, key: api-key } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 5 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: patient-api, namespace: healthcare }
spec:
  type: NodePort
  selector: { app: patient-api }
  ports: [{ port: 80, targetPort: 8080, nodePort: 30083 }]
