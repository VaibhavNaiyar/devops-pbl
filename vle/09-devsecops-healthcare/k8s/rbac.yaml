# Least privilege: Jenkins deployer can only manage workloads in the healthcare namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: deployer, namespace: healthcare }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "pods", "secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
