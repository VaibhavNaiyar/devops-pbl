# Least privilege: Jenkins deployer can only roll out the workload in the healthcare namespace.
# Services/Secrets are created once by an admin; the deployer may only read pods/services (Trivy KSV-0056/KSV-0041).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: deployer, namespace: healthcare }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
