apiVersion: v1
kind: Namespace
metadata: { name: bluegreen }
---
# LIVE service - users hit this. Switching the "color" selector = instant cutover
apiVersion: v1
kind: Service
metadata: { name: shop-live, namespace: bluegreen }
spec:
  type: NodePort
  selector: { app: shop, color: blue }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30081 }]
---
# PREVIEW service - always points at the idle color for testing before go-live
apiVersion: v1
kind: Service
metadata: { name: shop-preview, namespace: bluegreen }
spec:
  type: NodePort
  selector: { app: shop, color: green }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30082 }]
